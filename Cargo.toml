[workspace]
members = [
    "crates/elitelm-backend-genie",
    "crates/elitelm-core",
    "crates/elitelm-cli",
    "crates/elitelm-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["v4"] }
